[project]
name = "warehouse-forklift"
version = "0.1.0"
description = "Shared Python environment for the r2, r6-2, and r7 forklift workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==18.0.0",
    "ipykernel==7.3.0",
    "jupyterlab>=4.4,<5",
    "lap==0.5.13",
    "matplotlib==3.11.1",
    "numpy==2.4.4",
    "nvidia-ml-py>=13.590,<14",
    "onnx>=1.19,<2",
    "onnxruntime>=1.23,<2",
    "onnxslim>=0.1.82,<1",
    "opencv-python==4.14.0.94",
    "pillow>=12.2,<13",
    "pip>=26,<27",
    "polars>=1.43,<2",
    "psutil>=7.2,<8",
    "pyyaml==6.0.3",
    "scipy>=1.17,<2",
    "supervision==0.30.0",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    "tqdm>=4.70,<5",
    "ultralytics==8.4.116",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff==0.15.22",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["r6-2"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
